# BeaconRange: how far beacons give their powers.
# Vanilla radius is 10 + 10 * pyramid levels blocks (20, 30, 40, 50) around the beacon, any
# height above it and the same distance below. The mod multiplies it by `multiplier`:
# 4 gives 80, 120, 160, 200 blocks. 1 is vanilla. Allowed: 1 to 16 (fractions such as 2.5 too).
# Read once when the server starts: restart it after a change.
multiplier = 4
